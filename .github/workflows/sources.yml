name: sources
# Are the files still where the ingest looks for them, with headers it understands? Reads 64 KB per file,
# never the full downloads. Weekly, on demand, and whenever the code that depends on the sources changes.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ingest/sources.py
      - ingest/traffic.py
      - ingest/vehicle_layouts.py
      - scripts/check_sources.py
      - .github/workflows/sources.yml

jobs:
  live-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/check_sources.py
