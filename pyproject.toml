[project]
name = "zurich-traffic-ev"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Source headers are kept verbatim as one delimited string, the way they appear in the files.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
